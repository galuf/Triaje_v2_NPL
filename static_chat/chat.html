<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Enfermera Virtual - Triage ESI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            max-height: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.9em;
        }
        
        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            flex-shrink: 0;
        }
        
        .bot .avatar {
            background: #e3f2fd;
        }
        
        .user .avatar {
            background: #f3e5f5;
        }
        
        .bubble {
            max-width: 80%;
            padding: 15px;
            border-radius: 18px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .bot .bubble {
            background: #f1f5f9;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        
        .user .bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .result-bubble {
            background: #f0fdf4;
            border: 2px solid #16a34a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }
        
        .result-bubble h3 {
            color: #16a34a;
            margin-bottom: 10px;
            font-size: 1.3em;
        }
        
        .esi-result {
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
            color: white;
            font-weight: bold;
        }
        
        .esi-1 { background: #dc2626; }
        .esi-2 { background: #ea580c; }
        .esi-3 { background: #ca8a04; }
        .esi-4 { background: #16a34a; }
        .esi-5 { background: #15803d; }
        
        .esi-number {
            font-size: 3em;
            margin: 10px 0;
        }
        
        .esi-action {
            background: rgba(0,0,0,0.1);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        /* Input area */
        .input-container {
            padding: 15px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: white;
        }
        
        input, textarea {
            flex: 1;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            font-size: 1em;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            max-height: 80px;
        }
        
        button {
            width: 44px;
            height: 44px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 0;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #dc2626;
        }
        
        .disclaimer {
            font-size: 0.8em;
            color: #999;
            text-align: center;
            padding: 10px;
            border-top: 1px solid #e0e0e0;
        }
        
        @media (max-width: 600px) {
            .container {
                border-radius: 0;
                max-height: 100vh;
            }
            
            .bubble {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>👩‍⚕️ Enfermera Virtual</h1>
            <p>Evaluación de Triage ESI</p>
        </div>
        
        <!-- Chat -->
        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="avatar">👩‍⚕️</div>
                <div class="bubble">
                    ¡Hola! Soy tu enfermera virtual. Contame qué te está pasando y te voy a
                    hacer alguna pregunta más si hace falta para orientarte mejor.
                </div>
            </div>
        </div>
        
        <!-- Input -->
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Contame qué te pasa..." 
                   onkeypress="handleKeyPress(event)" autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
        
        <div class="disclaimer">
            ⚠️ En caso de emergencia, llamá al 117
        </div>
    </div>
    
    <script>
        // El servidor espera { messages: [...] }. Vacío/ausente en el primer
        // turno — server_chat_v2.py arma el mensaje "system" inicial solo.
        let conversationState = {};
        let isLoading = false;

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        }

        function addMessage(text, isBot = true) {
            const chatContainer = document.getElementById('chatContainer');

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isBot ? 'bot' : 'user'}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isBot ? '👩‍⚕️' : '🧑';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTyping() {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingMessage';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '👩‍⚕️';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingMessage');
            if (typing) typing.remove();
        }

        function showResult(esi, esiInfo) {
            const chatContainer = document.getElementById('chatContainer');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'message bot';

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '👩‍⚕️';

            const bubble = document.createElement('div');
            bubble.className = 'bubble result-bubble';

            const esiClass = `esi-${esi}`;
            bubble.innerHTML = `
                <h3>✅ Evaluación completada</h3>
                <p>Basándome en tu información, aquí está mi evaluación:</p>

                <div class="esi-result ${esiClass}">
                    <div>${esiInfo.name}</div>
                    <div class="esi-number">${esi}</div>
                    <div>${esiInfo.description}</div>
                </div>

                <div class="esi-action">
                    📋 ${esiInfo.action}
                </div>

                <p style="margin-top: 15px; font-size: 0.9em;">
                    Recordá: esta es una evaluación orientativa. El personal de la clínica
                    realizará una evaluación completa.
                </p>
            `;

            resultDiv.appendChild(avatar);
            resultDiv.appendChild(bubble);
            chatContainer.appendChild(resultDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Desactivar entrada — la conversación terminó
            document.getElementById('userInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
        }

        async function sendMessage() {
            if (isLoading) return;

            const input = document.getElementById('userInput');
            const userMessage = input.value.trim();

            if (!userMessage) return;

            isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            addMessage(userMessage, false);
            input.value = '';
            input.focus();

            showTyping();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_message: userMessage,
                        conversation_state: conversationState
                    })
                });

                const data = await response.json();
                removeTyping();

                if (data.error) {
                    addMessage(`❌ ${data.error}`);
                } else {
                    // El servidor devuelve el historial completo actualizado —
                    // lo guardamos tal cual para mandarlo de vuelta en el próximo turno.
                    conversationState = data.state;

                    // response siempre trae texto: o una pregunta de seguimiento,
                    // o la clasificación final (cuando done=true).
                    addMessage(data.response);

                    if (data.done) {
                        showResult(data.esi, data.esi_info);
                    }
                }

            } catch (err) {
                removeTyping();
                addMessage(`❌ Error: ${err.message}`);
            }

            isLoading = false;
            document.getElementById('sendBtn').disabled = false;
        }
    </script>
</body>
</html>
